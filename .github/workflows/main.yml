name: Github Actions Tutorial

on:
  push:
    branches:
      - main

jobs:
  Example-Job:
    runs-on: ubuntu-latest

    steps:
      - name: Print a welcome message
        run: echo "Welcome to our first Github Actions Workflow"

      - name: Checkout Repo
        uses: actions/checkout@v6.0.2

      - name: List Repo files
        run: ls -la

    
